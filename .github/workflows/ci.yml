name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev,dashboard,langgraph,openai-agents,autogen]"
      - run: ruff check src tests examples
      - run: pytest -q
      - run: mcp-chaos attack --target demo:secure --out runs/ci   # must exit 0

  docker-linux:
    # Native Linux: builds the sandbox image and runs the Docker isolation, egress-proxy and secret-delivery tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,dashboard]"
      - run: docker build -t mcp-chaos:local .
      - run: pytest -q tests/sandbox tests/integration/test_langgraph_and_docker.py -k "docker or egress or isolation or secrets"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      - name: Audit runtime dependencies (not dev tooling)
        run: |
          python -m venv /tmp/rt && /tmp/rt/bin/pip install -q .
          /tmp/rt/bin/pip freeze --exclude mcp-chaos > /tmp/runtime-requirements.txt
          pip-audit -r /tmp/runtime-requirements.txt --no-deps
