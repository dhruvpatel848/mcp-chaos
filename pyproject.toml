[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-chaos"
version = "0.1.0"
description = "Open-source security testing and red-teaming framework for tool-connected (MCP) AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Dhruv Patel", email = "dhruvpatel97730@gmail.com" }]
keywords = ["mcp", "ai-agents", "security", "red-team", "prompt-injection", "llm", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp>=1.2,<2",
  "pydantic>=2.5,<3",
  "PyYAML>=6,<7",
  "click>=8.1,<9",
  "rich>=13",
]

[project.urls]
Homepage = "https://github.com/dhruvpatel848/mcp-chaos"
Source = "https://github.com/dhruvpatel848/mcp-chaos"
Issues = "https://github.com/dhruvpatel848/mcp-chaos/issues"
Changelog = "https://github.com/dhruvpatel848/mcp-chaos/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dashboard = ["fastapi>=0.110,<1", "uvicorn>=0.27"]
langgraph = ["langgraph>=1"]
openai-agents = ["openai-agents>=0.24", "openai>=3,<4"]
autogen = ["autogen-agentchat>=0.7", "autogen-ext[mcp,openai]>=0.7"]
dev = ["httpx", "fastapi>=0.110,<1", "uvicorn>=0.27", "pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff"]

[project.scripts]
mcp-chaos = "mcp_chaos.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_chaos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
